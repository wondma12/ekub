services:
  - type: web
    name: digital-ekub
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build:render
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /draws/39/public
        destination: /index.html
      - type: rewrite
        source: /draws/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
